name: Analyze released save samples

on:
  push:
    paths:
      - ".github/workflows/analyze-release-saves.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download release archive
        run: |
          curl -fL "https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/Savefiles.zip" -o /tmp/Savefiles.zip
          unzip -l /tmp/Savefiles.zip
      - name: Analyze descriptions and player blocks
        run: |
          python3 - <<'PY'
          import zipfile, io, os, re, hashlib, struct
          from pathlib import Path
          files={}
          def collect(zf,prefix=''):
              for info in zf.infolist():
                  if info.is_dir(): continue
                  data=zf.read(info.filename); name=prefix+info.filename
                  if data[:2]==b'PK':
                      try:
                          with zipfile.ZipFile(io.BytesIO(data)) as inner:
                              collect(inner,name+'!')
                              continue
                      except zipfile.BadZipFile: pass
                  files[name]=data
          with zipfile.ZipFile('/tmp/Savefiles.zip') as z: collect(z)
          texts={n:d.decode('utf-8','replace') for n,d in files.items() if n.lower().endswith('.txt')}
          saves={n:d for n,d in files.items() if '!' in n and not n.lower().endswith('.txt')}
          print('=== SAMPLE PAIRS / GROUND TRUTH ===')
          labelled={}
          for n,d in sorted(saves.items()):
              savebase=os.path.basename(n.split('!')[0])
              ts=[(x,t) for x,t in texts.items() if os.path.basename(x[:-4])==savebase]
              print(f'\nSAVE {savebase}, payload={os.path.basename(n.split("!")[-1])}, bytes={len(d)}, sha256={hashlib.sha256(d).hexdigest()}')
              t='\n'.join(x[1] for x in ts)
              for x,txt in ts: print('TXT MATCH:',x)
              print(t)
              vals={}
              for label,pat in [
                ('health',r'Макс\.\s*Здоровье:\s*(\d+)'),
                ('energy',r'Макс\.\s*Энергия:\s*(\d+)')]:
                  m=re.search(pat,t,re.I)
                  if m: vals[label]=int(m.group(1))
              if vals: labelled[n]=(vals,d)
          print('=== SRPL LOCATIONS ===')
          markers={}
          for n,(vals,d) in labelled.items():
              locs=[m.start() for m in re.finditer(b'SRPL',d)]
              markers[n]=locs
              print(os.path.basename(n.split('!')[0]),vals,'SRPL offsets:',[hex(x) for x in locs])
              for p in locs:
                  print('  context:',d[max(0,p-24):p+160].hex())
          for label in ('health','energy'):
              rows=[(n,v[label],d) for n,(v,d) in labelled.items() if label in v and markers.get(n)]
              print(f'=== EXACT CANDIDATES {label}: {[(os.path.basename(n.split("!")[0]),v) for n,v,_ in rows]} ===')
              if len(rows)<2: continue
              for width,fmt in [(1,'B'),(2,'H'),(4,'I'),(8,'Q')]:
                  hits=[]
                  for rel in range(-min(markers[n][0] for n,_,_ in rows), min(len(d)-markers[n][0] for n,_,d in rows)-width+1):
                      vals=[]
                      for n,_,d in rows:
                          anchor=markers[n][0]
                          if anchor+rel+width>len(d): break
                          vals.append(struct.unpack_from('<'+fmt,d,anchor+rel)[0])
                      if len(vals)==len(rows) and vals==[v for _,v,_ in rows]: hits.append(rel)
                  for rel in hits[:100]: print(f'  SRPL{rel:+#x} uint{width*8} LE => {[v for _,v,_ in rows]}')
              fhits=[]
              for rel in range(-min(markers[n][0] for n,_,_ in rows), min(len(d)-markers[n][0] for n,_,d in rows)-3):
                  vals=[]
                  for n,_,d in rows:
                      anchor=markers[n][0]
                      if anchor+rel+4>len(d): break
                      vals.append(struct.unpack_from('<f',d,anchor+rel)[0])
                  if len(vals)==len(rows) and all(abs(x-v)<1e-4 for x,(_,v,_) in zip(vals,rows)): fhits.append(rel)
              for rel in fhits[:100]: print(f'  SRPL{rel:+#x} float32 => {[v for _,v,_ in rows]}')
          print('=== PLAYER-REGION LENGTH / FIRST 512 BYTES ===')
          for n,(vals,d) in labelled.items():
              for p in markers[n]:
                  print(os.path.basename(n.split('!')[0]), 'marker',hex(p))
                  print(d[p:p+512].hex())
          print('=== SLOT CAPACITY VALUE SCAN ===')
          caps={'20261122185933-1-1':50,'20261125175309-3-0':20,'20261125171726-2-1':20}
          for n,(vals,d) in labelled.items():
              base=os.path.basename(n.split('!')[0])
              if base not in caps: continue
              ps=markers[n][0]; cap=caps[base]
              print('SAVE',base,'expected capacity',cap)
              for width,fmt in ((1,'B'),(2,'H'),(4,'I')):
                  pat=struct.pack('<'+fmt,cap); hits=[]; p=0
                  while True:
                      p=d.find(pat,p)
                      if p<0: break
                      if ps-512 <= p <= ps+20000: hits.append(p)
                      p+=1
                  print('width',width,'hits',[(hex(p),hex(p-ps)) for p in hits[:80]])
              recs=[m.start() for m in re.finditer(b'\\x04SRAD\\x02\\x00\\x00\\x00\\x00\\x30',d)]
              for p in [x for x in recs if ps<=x<ps+12000][:12]:
                  print('SRAD',hex(p),'rel',hex(p-ps),'raw',d[p:p+64].hex())
          print('=== END ===')
          PY
