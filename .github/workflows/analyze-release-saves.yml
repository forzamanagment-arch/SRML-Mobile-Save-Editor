name: Analyze released save samples

on:
  push:
    paths:
      - ".github/workflows/analyze-release-saves.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Download Savefiles release asset
        run: |
          curl -fL "https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/Savefiles.zip" -o /tmp/Savefiles.zip
          unzip -l /tmp/Savefiles.zip
      - name: Analyze paired saves and descriptions
        run: |
          python3 - <<'PY'
          import zipfile, io, os, re, hashlib, struct, math
          from pathlib import Path
          archive = Path('/tmp/Savefiles.zip')
          files = {}
          def collect(zf, prefix=''):
              for info in zf.infolist():
                  if info.is_dir(): continue
                  data = zf.read(info.filename)
                  name = prefix + info.filename
                  if data[:2] == b'PK':
                      try:
                          with zipfile.ZipFile(io.BytesIO(data)) as inner:
                              collect(inner, name + '!')
                              continue
                      except zipfile.BadZipFile:
                          pass
                  files[name] = data
          with zipfile.ZipFile(archive) as z:
              collect(z)
          print('=== FILE INVENTORY ===')
          for n,d in sorted(files.items()):
              print(f'{n}\t{len(d)} bytes\t{hashlib.sha256(d).hexdigest()[:16]}')
          texts = {n:d.decode('utf-8', 'replace') for n,d in files.items() if n.lower().endswith('.txt')}
          saves = {n:d for n,d in files.items() if not n.lower().endswith(('.txt','.md','.json','.xml'))}
          print('=== USER DESCRIPTIONS ===')
          for n,t in sorted(texts.items()):
              print(f'--- {n} ---')
              print(t[:12000])
          def norm(n):
              return re.sub(r'(?i)\.txt$', '', n)
          print('=== SAVE / TXT PAIRING ===')
          for n,d in sorted(saves.items()):
              candidates=[x for x in texts if norm(x)==n or norm(x).endswith('/'+n.split('/')[-1])]
              print(f'{n}: ' + (', '.join(candidates) if candidates else 'NO MATCHED TXT'))
          print('=== HEALTH / ENERGY VALUES IN DESCRIPTIONS ===')
          for n,t in sorted(texts.items()):
              if re.search(r'health|энерг|здоров|макс', t, re.I):
                  print(f'[{n}]')
                  for line in t.splitlines():
                      if re.search(r'health|энерг|здоров|макс', line, re.I): print(line[:500])
          print('=== PAIRWISE BINARY DIFFERENCES ===')
          sn=sorted(saves)
          for i in range(len(sn)):
              for j in range(i+1,len(sn)):
                  a,b=saves[sn[i]],saves[sn[j]]
                  if len(a)!=len(b):
                      print(f'{sn[i]} <> {sn[j]}: SIZE {len(a)} vs {len(b)}')
                      continue
                  runs=[]; start=None; prev=None
                  for k,(x,y) in enumerate(zip(a,b)):
                      if x!=y:
                          if start is None: start=k
                          prev=k
                      elif start is not None:
                          runs.append((start,prev)); start=None
                  if start is not None:runs.append((start,prev))
                  print(f'{sn[i]} <> {sn[j]}: {len(runs)} changed ranges, {sum(e-s+1 for s,e in runs)} changed bytes')
                  for s,e in runs[:160]:
                      lo=max(0,s-8); hi=min(len(a),e+9)
                      print(f'  0x{s:X}-0x{e:X} ({e-s+1}B) A={a[s:e+1].hex()} B={b[s:e+1].hex()} contextA={a[lo:hi].hex()}')
          print('=== INTEGER / FLOAT CANDIDATES FOR LABELLED HEALTH-ENERGY SAMPLES ===')
          # For each save, search all byte-aligned 1/2/4/8-byte values and float32
          # matching explicit numbers found in its paired description; only report offsets
          # with consistent value-to-label across samples.
          labelled={}
          for n,d in saves.items():
              base=os.path.basename(n)
              ts=[t for x,t in texts.items() if os.path.basename(norm(x))==base]
              if not ts: continue
              t='\n'.join(ts)
              vals={}
              for label,pat in [('health',r'(?:max(?:imum)?\\s*health|макс\\.?\\s*(?:здоров(?:ье|ья)|хп)|здоров(?:ье|ья))\\D{0,30}(\\d+)'),
                                ('energy',r'(?:max(?:imum)?\\s*energy|макс\\.?\\s*энерг(?:ия|ии)|энерг(?:ия|ии))\\D{0,30}(\\d+)')]:
                  m=re.search(pat,t,re.I)
                  if m: vals[label]=int(m.group(1))
              if vals: labelled[n]=vals
          for label in ('health','energy'):
              rows=[(n,v[label],saves[n]) for n,v in labelled.items() if label in v]
              print(f'-- {label}: {[(os.path.basename(n),v) for n,v,_ in rows]}')
              if len(rows)<2: continue
              maxlen=min(len(d) for _,_,d in rows)
              for width,fmt in [(1,'B'),(2,'H'),(4,'I'),(8,'Q')]:
                  matches=[]
                  for off in range(0,maxlen-width+1):
                      vals=[struct.unpack_from('<'+fmt,d,off)[0] for _,_,d in rows]
                      if vals==[v for _,v,_ in rows] and len(set(vals))>1: matches.append((off,vals,'le'))
                      vals=[struct.unpack_from('>'+fmt,d,off)[0] for _,_,d in rows]
                      if vals==[v for _,v,_ in rows] and len(set(vals))>1: matches.append((off,vals,'be'))
                  for off,vs,end in matches[:100]: print(f'  exact {width}-byte {end} @0x{off:X}: {vs}')
              matches=[]
              for off in range(0,maxlen-3):
                  vs=[struct.unpack_from('<f',d,off)[0] for _,_,d in rows]
                  if all(math.isfinite(x) for x in vs) and all(abs(x-v)<1e-4 for x,(_,v,_) in zip(vs,rows)) and len(set(vs))>1: matches.append((off,vs))
              for off,vs in matches[:100]: print(f'  exact float32 @0x{off:X}: {vs}')
          print('=== END ===')
          PY
