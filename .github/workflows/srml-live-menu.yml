name: SRML Live Menu Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'SRML-Live-Menu/**'
      - '.github/workflows/srml-live-menu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SRML-Live-Menu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRML-Live-Menu-debug
          path: SRML-Live-Menu/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
