name: Inspect SRSE records for persistent identifiers
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/inspect-srse-records.yml"
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fL "https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/Savefiles.zip" -o /tmp/saves.zip
      - run: |
          python3 - <<'PY'
          import zipfile,io,os,re,struct,collections
          names=['20261125171726-2-1','20261125175309-3-0','20261122185933-1-1']; found={}
          def walk(z,p=''):
            for it in z.infolist():
              if it.is_dir(): continue
              b=z.read(it.filename); path=p+it.filename
              if b[:2]==b'PK':
                try: walk(zipfile.ZipFile(io.BytesIO(b)),path+'!'); continue
                except: pass
              if path.endswith('gamesave-sav'):
                root=os.path.basename(path.split('!')[0])
                if root in names: found[root]=b
          walk(zipfile.ZipFile('/tmp/saves.zip'))
          for n in names:
            b=found[n]; ps=[m.start() for m in re.finditer(b'SRSE',b)]
            print('\nSAVE',n,'SRSE',len(ps))
            for i,p in enumerate(ps[:80]):
              chunk=b[max(0,p-12):p+112]
              strs=[(m.start(),m.group().decode('ascii','ignore')) for m in re.finditer(rb'[ -~]{4,}',chunk)]
              if strs or i<12:
                print('REC',i,'ABS',hex(p),'HEX',chunk.hex())
                print('STRS',strs)
          PY