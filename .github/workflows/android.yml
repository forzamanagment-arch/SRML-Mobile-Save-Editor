name: Android Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unpack official game UI resources
        run: |
          mkdir -p app/src/main/assets/game-icons app/src/main/assets/fonts app/src/main/assets/interface-icons
          curl -L --fail --retry 3 'https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/IconsInterface.zip' -o /tmp/sr-interface-icons.zip
          unzip -oq /tmp/sr-interface-icons.zip -d app/src/main/assets/interface-icons
          echo "Interface icon files:"
          find app/src/main/assets/interface-icons -type f | sort
          curl -L --fail --retry 3 'https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/Icons.zip' -o /tmp/sr-icons.zip
          curl -L --fail --retry 3 'https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/newicons.zip' -o /tmp/sr-new-icons.zip
          curl -L --fail --retry 3 'https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/PLORTGold.webp' -o app/src/main/assets/game-icons/PLORTGold.webp
          curl -L --fail --retry 3 'https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/Font.Nunito.Full-ver.zip' -o /tmp/sr-fonts.zip
          unzip -q /tmp/sr-icons.zip -d app/src/main/assets/game-icons
          unzip -oq /tmp/sr-new-icons.zip -d app/src/main/assets/game-icons
          unzip -q /tmp/sr-fonts.zip -d app/src/main/assets/fonts
          echo "Combined game icon files: $(find app/src/main/assets/game-icons -type f | wc -l)"
          echo "New icon filenames (sample):"
          find app/src/main/assets/game-icons -type f | sort | grep -iE 'ornament|fashion|echo|chime|scare|key|water' | head -100 || true
          echo "Font files:"
          find app/src/main/assets/fonts -type f
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SRML-Mobile-Save-Editor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
