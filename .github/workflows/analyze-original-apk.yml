name: SRML Original APK Analysis

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/analyze-original-apk.yml'

permissions:
  contents: read

jobs:
  analyze-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Download original APK archive from release
        env:
          APK_ARCHIVE_URL: https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/SlimeRancherAPK.zip
        run: |
          set -euo pipefail
          mkdir -p input reports
          curl -fL --retry 5 --retry-delay 3 "$APK_ARCHIVE_URL" -o input/SlimeRancherAPK.zip
          sha256sum input/SlimeRancherAPK.zip | tee reports/OUTER_ARCHIVE_SHA256.txt
          ls -lh input/SlimeRancherAPK.zip

      - name: Locate and extract APK from archive
        run: |
          python3 - <<'PY'
          import zipfile, pathlib, sys
          archive = pathlib.Path("input/SlimeRancherAPK.zip")
          out = pathlib.Path("input/extracted")
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              candidates = [i for i in z.infolist() if i.filename.lower().endswith(".apk") and not i.is_dir()]
              print("Outer archive entries:", len(z.infolist()))
              print("APK candidates:")
              for i in candidates:
                  print(f"{i.file_size}\t{i.filename}")
              if not candidates:
                  print("No APK file found in uploaded ZIP", file=sys.stderr)
                  sys.exit(2)
              candidates.sort(key=lambda i: i.file_size, reverse=True)
              chosen = candidates[0]
              target = out / pathlib.Path(chosen.filename).name
              with z.open(chosen) as src, target.open("wb") as dst:
                  while True:
                      chunk = src.read(8 * 1024 * 1024)
                      if not chunk: break
                      dst.write(chunk)
              (pathlib.Path("reports") / "APK_ARCHIVE_CONTENTS.txt").write_text(
                  "\n".join(f"{i.file_size}\t{i.filename}" for i in z.infolist()),
                  encoding="utf-8"
              )
              print("Selected APK:", target, "bytes:", target.stat().st_size)
              (pathlib.Path("reports") / "SELECTED_APK.txt").write_text(
                  f"Selected: {chosen.filename}\nUncompressed size: {chosen.file_size}\n",
                  encoding="utf-8"
              )
          PY
          sha256sum input/extracted/*.apk | tee reports/APK_SHA256.txt

      - name: Install Android inspection tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build tools, JADX and LLVM
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
          sudo apt-get update
          sudo apt-get install -y binutils llvm unzip
          curl -fL --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip -o /tmp/jadx.zip
          mkdir -p /tmp/jadx
          unzip -q /tmp/jadx.zip -d /tmp/jadx
          chmod +x /tmp/jadx/bin/jadx
          llvm-objdump --version | head -n 2

      - name: Inspect APK manifest, DEX and native libraries
        run: |
          set -euo pipefail
          APK="$(find input/extracted -maxdepth 1 -name '*.apk' -print -quit)"
          AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          "$AAPT" dump badging "$APK" > reports/APK_BADGING.txt
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > reports/ANDROID_MANIFEST_XMLTREE.txt
          unzip -l "$APK" > reports/APK_FILE_INDEX.txt
          mkdir -p input/apk-unpacked reports/native
          unzip -q "$APK" 'classes*.dex' 'lib/*/*.so' 'assets/bin/Data/Managed/*' -d input/apk-unpacked || true
          find input/apk-unpacked -type f -name '*.so' -print | sort > reports/NATIVE_LIBRARY_LIST.txt
          find input/apk-unpacked -type f -name '*.dex' -print | sort > reports/DEX_LIST.txt
          while IFS= read -r lib; do
            [ -f "$lib" ] || continue
            name="$(basename "$lib")"
            {
              echo "===== $lib ====="
              readelf -h "$lib" || true
              readelf -l "$lib" || true
              echo "--- exported il2cpp/JNI/Unity symbols ---"
              nm -D --defined-only "$lib" 2>/dev/null | grep -Ei 'il2cpp_|JNI_OnLoad|JNI_OnUnload|UnityPlayer|ANativeActivity|Java_' || true
            } > "reports/native/$name.txt"
          done < reports/NATIVE_LIBRARY_LIST.txt
          grep -E 'package: name=|launchable-activity:|sdkVersion:|targetSdkVersion:|native-code:' reports/APK_BADGING.txt || true
          python3 - <<'PY'
          import pathlib, re, zipfile
          apk = next(pathlib.Path("input/extracted").glob("*.apk"))
          report = []
          lookup = {
              "assets/bin/Data/globalgamemanagers": [0x14, 0x30],
              "assets/bin/Data/data.unity3d": [0x12],
              "assets/bin/Data/mainData": [0x14],
          }
          pattern = re.compile(rb"^\d+\.\d+\.\d+(?:[abcfp]\d+|rc\d+)?$")
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              for name, offsets in lookup.items():
                  if name not in names:
                      report.append(f"{name}: NOT PRESENT")
                      continue
                  with z.open(name) as f:
                      head = f.read(128)
                  report.append(f"{name}: present, size={z.getinfo(name).file_size}")
                  report.append(f"  first_64_hex={head[:64].hex()}")
                  for offset in offsets:
                      candidate = head[offset:offset+32].split(b"\0", 1)[0]
                      printable = candidate.decode("ascii", "replace")
                      valid = bool(pattern.fullmatch(candidate))
                      report.append(f"  offset_0x{offset:X}: {printable!r}; fusioncore_version_match={valid}")
          out = "\n".join(report) + "\n"
          pathlib.Path("reports/UNITY_VERSION_PROBE.txt").write_text(out, encoding="utf-8")
          print(out)
          PY
          echo "Manifest, APK inventory and Unity version probe generated."

      - name: Deep-inspect Unity bootstrap and app-specific native wrapper
        run: |
          set -euo pipefail
          APK="$(find input/extracted -maxdepth 1 -name '*.apk' -print -quit)"
          mkdir -p reports/native-deep reports/native-binaries
          for name in libmain.so libzqc63dn9mh.so; do
            lib="input/apk-unpacked/lib/arm64-v8a/$name"
            if [ ! -f "$lib" ]; then
              echo "Missing expected library: $lib" | tee "reports/native-deep/$name.MISSING.txt"
              continue
            fi
            cp "$lib" "reports/native-binaries/$name"
            out="reports/native-deep/$name"
            {
              echo "## File identity"
              stat "$lib"
              sha256sum "$lib"
              echo
              echo "## ELF build ID and notes"
              readelf -n "$lib" || true
              echo
              echo "## Dynamic section and dependencies"
              readelf -d "$lib" || true
              echo
              echo "## Dynamic symbols"
              readelf --dyn-syms -W "$lib" || true
              echo
              echo "## Full symbol table"
              readelf --syms -W "$lib" || true
              echo
              echo "## Relocations"
              readelf -rW "$lib" || true
              echo
              echo "## Demangled exported symbols"
              nm -D -C "$lib" 2>/dev/null || true
            } > "$out.elf-report.txt"
            strings -a -n 5 "$lib" > "$out.strings.txt"
            grep -Ein 'JNI_OnLoad|RegisterNatives|GetMethodID|GetStaticMethodID|signature|certificate|launcher|unity|il2cpp|plugin|mod|loadLibrary|dlopen|dlsym|asset|class' "$out.strings.txt" > "$out.strings-filtered.txt" || true
            llvm-objdump -d --demangle --symbolize-operands --disassemble-symbols=JNI_OnLoad "$lib" > "$out.JNI_OnLoad.disasm.txt" 2>&1 || true
          done
          {
            echo "# Deep native inspection"
            echo
            echo "Target: ARM64 Android native libraries from Slime Rancher Mobile 1.1.1103."
            echo
            echo "The two target binaries are included in native-binaries/ so they can be independently inspected."
            echo
            echo "## JNI_OnLoad disassembly"
            for f in reports/native-deep/*.JNI_OnLoad.disasm.txt; do
              echo
              echo "### $(basename "$f")"
              cat "$f"
            done
            echo
            echo "## Filtered strings"
            for f in reports/native-deep/*.strings-filtered.txt; do
              echo
              echo "### $(basename "$f")"
              cat "$f"
            done
          } > reports/NATIVE_DEEP_INSPECTION_INDEX.md
          du -h reports/native-binaries/* || true

      - name: Decompile Java/Kotlin DEX code and index Unity loading paths
        run: |
          set -euo pipefail
          APK="$(find input/extracted -maxdepth 1 -name '*.apk' -print -quit)"
          /tmp/jadx/bin/jadx --no-res --show-bad-code -d reports/jadx "$APK" > reports/JADX_LOG.txt 2>&1 || true
          grep -RniE 'System\.loadLibrary|System\.load\(|JNI_OnLoad|UnityPlayerActivity|UnityPlayer|libil2cpp|libunity|native[A-Z_a-z0-9]*\(' reports/jadx --include='*.java' --include='*.kt' > reports/JAVA_NATIVE_LOADING_REFERENCES.txt || true
          grep -RniE 'com\.unity3d|playdigious|UnityPlayer' reports/jadx --include='*.java' --include='*.kt' | head -n 500 > reports/UNITY_AND_PUBLISHER_REFERENCES.txt || true
          echo "JADX output files: $(find reports/jadx -type f | wc -l)"

      - name: Create concise analysis index
        if: always()
        run: |
          {
            echo "# Original Slime Rancher Mobile APK analysis"
            echo
            echo "## Input"
            cat reports/SELECTED_APK.txt 2>/dev/null || true
            cat reports/APK_SHA256.txt 2>/dev/null || true
            echo
            echo "## Package and Android entry points"
            grep -E 'package: name=|launchable-activity:|sdkVersion:|targetSdkVersion:|native-code:' reports/APK_BADGING.txt 2>/dev/null || true
            echo
            echo "## Native libraries"
            cat reports/NATIVE_LIBRARY_LIST.txt 2>/dev/null || true
            echo
            echo "## DEX files"
            cat reports/DEX_LIST.txt 2>/dev/null || true
            echo
            echo "## JNI / Unity loading references"
            head -n 250 reports/JAVA_NATIVE_LOADING_REFERENCES.txt 2>/dev/null || true
            echo
            echo "## Deep native inspection"
            cat reports/NATIVE_DEEP_INSPECTION_INDEX.md 2>/dev/null || true
            echo
            echo "## Relevant native exports"
            grep -RhiE 'il2cpp_|JNI_OnLoad|JNI_OnUnload|Java_' reports/native 2>/dev/null | head -n 500 || true
          } > reports/GAME_APK_ANALYSIS_INDEX.md

      - name: Upload APK analysis reports and selected native binaries
        uses: actions/upload-artifact@v4
        with:
          name: srml-original-apk-native-deep-analysis
          path: reports/
          if-no-files-found: error
          retention-days: 14
