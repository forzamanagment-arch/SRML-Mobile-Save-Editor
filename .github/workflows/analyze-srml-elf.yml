name: Analyze SRML ELF Files

on:
  push:
    paths:
      - ".github/workflows/analyze-srml-elf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Download and extract uploaded game files
        run: |
          curl -L --fail --retry 3 "https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/FilesSRML.zip" -o FilesSRML.zip
          unzip -q FilesSRML.zip -d extracted
      - name: Inspect ELF headers and metadata
        run: |
          python3 - <<'PY'
          import struct, hashlib
          from pathlib import Path
          root=Path("extracted")
          out=[]
          files=sorted(p for p in root.rglob("*") if p.is_file())
          out.append(f"File count: {len(files)}")
          for p in files:
              if p.suffix.lower() != ".so":
                  continue
              h=p.read_bytes()[:64]
              digest=hashlib.sha256(p.read_bytes()).hexdigest()
              out.append(f"\n{p.relative_to(root)}")
              out.append(f"size={p.stat().st_size}; sha256={digest}")
              out.append(f"header32={h[:32].hex(' ')}")
              if len(h)>=20 and h[:4]==bytes([0x7f,0x45,0x4c,0x46]):
                  endian="<" if h[5]==1 else ">" if h[5]==2 else None
                  machine=struct.unpack(endian+"H",h[18:20])[0] if endian else -1
                  out.append(f"ELF class={h[4]} machine={machine} (183=AArch64)")
              else:
                  out.append("Not an ELF header")
          for p in files:
              if p.name=="global-metadata.dat":
                  h=p.read_bytes()[:16]
                  magic,version=struct.unpack("<II",h[:8])
                  out.append(f"\nMETADATA: {p.relative_to(root)}")
                  out.append(f"size={p.stat().st_size}; magic=0x{magic:08X}; metadata_version={version}")
              if p.name=="il2cpp.usym":
                  h=p.read_bytes()[:32]
                  out.append(f"\nUSYM: {p.relative_to(root)}")
                  out.append(f"size={p.stat().st_size}; header32={h.hex(' ')}")
          text="\n".join(out)
          Path("elf-analysis.txt").write_text(text,encoding="utf-8")
          print(text)
          PY
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: srml-elf-analysis
          path: elf-analysis.txt
          retention-days: 14
