name: Patch Slime Rancher Mobile save

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch-save:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Patch and verify save
        run: python tools/patch_save_values.py

      - name: Publish modified save artifact
        uses: actions/upload-artifact@v4
        with:
          name: SlimeRancherMobile-modified-save
          path: output/modified_save.zip
          if-no-files-found: error
          retention-days: 7
