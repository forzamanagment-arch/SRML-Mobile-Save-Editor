name: SRML IL2CPP Metadata Analysis

on:
  push:
    paths:
      - ".github/workflows/analyze-srml-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download uploaded game archive
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            "https://github.com/forzamanagment-arch/SRML-Mobile-Save-Editor/releases/download/Saves/FilesSRML.zip" \
            -o FilesSRML.zip
          unzip -q FilesSRML.zip -d extracted
          echo "Archive downloaded and extracted."

      - name: Locate IL2CPP inputs
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          LIB="$(find extracted -type f -name 'libil2cpp.so' -print -quit)"
          META="$(find extracted -type f -name 'global-metadata.dat' -print -quit)"
          if [ -z "$LIB" ] || [ -z "$META" ]; then
            echo "Required input missing: lib=$LIB metadata=$META"
            exit 1
          fi
          echo "lib=$LIB" >> "$GITHUB_OUTPUT"
          echo "metadata=$META" >> "$GITHUB_OUTPUT"
          echo "Library: $LIB ($(stat -c%s "$LIB") bytes)"
          echo "Metadata: $META ($(stat -c%s "$META") bytes)"

      - name: Inspect libil2cpp ELF layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis-output/elf
          readelf -hW "${{ steps.locate.outputs.lib }}" > analysis-output/elf/ELF_HEADER.txt
          readelf -lW "${{ steps.locate.outputs.lib }}" > analysis-output/elf/PROGRAM_HEADERS.txt
          readelf -SW "${{ steps.locate.outputs.lib }}" > analysis-output/elf/SECTION_HEADERS.txt
          sha256sum "${{ steps.locate.outputs.lib }}" > analysis-output/elf/SHA256.txt
          {
            echo "# libil2cpp.so ELF inspection"
            echo
            echo "## ELF header"
            cat analysis-output/elf/ELF_HEADER.txt
            echo
            echo "## Program headers (PT_LOAD mapping)"
            cat analysis-output/elf/PROGRAM_HEADERS.txt
            echo
            echo "## Section headers"
            cat analysis-output/elf/SECTION_HEADERS.txt
            echo
            echo "## SHA-256"
            cat analysis-output/elf/SHA256.txt
          } > analysis-output/ELF_LAYOUT.txt
          echo "ELF inspection saved to analysis-output/ELF_LAYOUT.txt"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.25.4"
          cache: false

      - name: Build pinned disunity analyzer
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/zboralski/disunity.git disunity-src
          cd disunity-src
          git checkout d3358416e5e0bf9c60e211d3b8093224d843e4d4
          go test ./...
          go build -o ../disunity ./cmd/disunity

      - name: Parse metadata and correlate native methods
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p analysis-output
          ./disunity meta \
            --out analysis-output --all \
            "${{ steps.locate.outputs.lib }}" \
            "${{ steps.locate.outputs.metadata }}"
          echo "Generated files:"
          find analysis-output -maxdepth 2 -type f -printf '%p (%s bytes)\\n'
          test -s analysis-output/unity_meta.json
          test -s analysis-output/script.json

      - name: Build readable game explorer index
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          root=Path("analysis-output")
          meta_candidates=list(root.rglob("unity_meta.json"))
          script_candidates=list(root.rglob("script.json"))
          meta_path=meta_candidates[0] if meta_candidates else root/"unity_meta.json"
          script_path=script_candidates[0] if script_candidates else root/"script.json"
          report=[]
          report.append("# SRML Game Explorer: IL2CPP analysis")
          report.append("")
          if meta_path.exists():
              data=json.loads(meta_path.read_text(encoding="utf-8"))
              classes=data.get("classes", [])
              funcs=data.get("functions", [])
              report += [
                  f"- Metadata version: **{data.get('il2cpp_version', 'unknown')}**",
                  f"- Parsed classes: **{len(classes)}**",
                  f"- Functions with native addresses: **{len(funcs)}**",
                  f"- Pointer size: **{data.get('pointer_size', 'unknown')} bytes**",
                  "",
                  "## Classes matching game-system keywords",
              ]
              pattern=re.compile(r"player|slime|inventory|item|world|zone|spawn|food|plort|vac|ranch|save|health|energy|currency|currency|store|market|gadget|upgrade", re.I)
              hits=[]
              for c in classes:
                  full=(c.get("namespace","")+"."+c.get("class_name","")).strip(".")
                  if pattern.search(full):
                      hits.append((full,c.get("parent_class",""),len(c.get("fields",[]))))
              report += [f"- `{name}`" + (f" : parent `{parent}`" if parent else "") + f" ({fields} fields)" for name,parent,fields in hits[:500]]
              report.append("")
              report.append("## Matching methods")
              method_hits=[]
              for f in funcs:
                  name=f.get("name","")
                  if pattern.search(name):
                      method_hits.append(f"- `{name}` at `{f.get('addr','?')}`")
              report += method_hits[:1000]
              report.append("")
              report.append("## Notes")
              report.append("- Class and method names are extracted from metadata and linked to addresses where the analyzer resolved them.")
              report.append("- A missing address does not mean a method is absent; generic, stripped, or unresolved methods may need separate analysis.")
          else:
              report += ["Metadata parser did not produce unity_meta.json.", "See workflow logs for the parser error."]
              report += [f"- Found files: {p}" for p in root.rglob("*") if p.is_file()]
          (root/"GAME_EXPLORER_INDEX.md").write_text("\n".join(report),encoding="utf-8")
          print("\n".join(report[:80]))
          PY


      - name: Inspect unresolved IL2CPP runtime helpers and USYM symbols
        shell: bash
        run: |
          set -euo pipefail
          LIB="${{ steps.locate.outputs.lib }}"
          USYM="$(find extracted -type f -name 'il2cpp.usym' -print -quit || true)"
          mkdir -p analysis-output/runtime-helpers
          sudo apt-get update -qq
          sudo apt-get install -y llvm binutils
          OBJDUMP="$(command -v llvm-objdump || command -v llvm-objdump-20 || command -v llvm-objdump-19 || command -v llvm-objdump-18)"
          {
            echo "# Runtime helper investigation"
            echo
            echo "## Binary symbols"
            readelf -Ws "$LIB" | head -n 300
            echo
            echo "## Dynamic symbols"
            nm -D -C "$LIB" 2>&1 | head -n 300 || true
          } > analysis-output/runtime-helpers/NATIVE_SYMBOLS.txt
          if [ -n "$USYM" ]; then
            {
              echo "USYM_PATH=$USYM"
              stat "$USYM"
              file "$USYM"
              echo
              echo "First 256 bytes:"
              xxd -g1 -l 256 "$USYM"
              echo
              echo "First printable strings:"
              strings -a -n 4 "$USYM" | head -n 500
            } > analysis-output/runtime-helpers/IL2CPP_USYM_INSPECTION.txt
          else
            echo "il2cpp.usym not found in uploaded archive" > analysis-output/runtime-helpers/IL2CPP_USYM_INSPECTION.txt
          fi
          dump_range() {
            local name="$1" start="$2" stop="$3"
            "$OBJDUMP" -d --no-show-raw-insn --start-address="$start" --stop-address="$stop" "$LIB" \
              > "analysis-output/runtime-helpers/$name.txt"
          }
          # The unresolved targets previously observed in SceneContext/PlayerState startup.
          dump_range helper_1F7C350 0x1F7C250 0x1F7C480
          dump_range helper_1F82300 0x1F82200 0x1F82440
          dump_range helper_1F88690 0x1F88590 0x1F88820
          dump_range helper_2C5F524 0x2C5F440 0x2C5F620
          dump_range helper_2C5F794 0x2C5F6B0 0x2C5F880
          # Managed callsites around the helper invocations.
          dump_range SceneContext_Awake 0x33DD17C 0x33DD940
          dump_range SceneContext_Start 0x33DDB14 0x33DDC20
          dump_range SceneContext_Start_MoveNext 0x33DE724 0x33DF7D8
          dump_range PlayerState_InitForLevel 0x3360900 0x3360994
          dump_range Identifiable_Awake 0x32BEA10 0x32BEC00
          echo "Runtime helper disassembly and USYM inspection complete."

      - name: Upload complete analysis
        uses: actions/upload-artifact@v4
        with:
          name: srml-il2cpp-metadata-analysis
          path: analysis-output/
          if-no-files-found: error
          retention-days: 14
