plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.srmlmobile.saveeditor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.srmlmobile.saveeditor'
        minSdk 24
        targetSdk 28
        versionCode 3
        versionName '0.1-prototype'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}
